name: Adjustable Partial Zoom Build

on:
  push:
    branches:
      - feature/adjustable-zoom-21-20-405
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and compile patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: morphe-adjustable-zoom-21-20-405
          path: patches/build/libs/*.mpp
          if-no-files-found: error
